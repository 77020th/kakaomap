<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎭 대학로 연극·뮤지컬 극장 지도</title>
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=94cff6c2e858861851aa038ebb76d145&libraries=services&autoload=false"></script>
    <style>
        /* 🎨 1. 기본 스타일 초기화 및 레이아웃 정의 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Malgun Gothic";
            overflow: hidden;
        }

        /* 2분할 플렉스 컨테이너 */
        #container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* 🔍 2. 왼쪽 사이드바 (검색 기능, 카테고리 탭, 목록 리스트) */
        #sidebar {
            width: 360px;
            height: 100%;
            background-color: #ffffff;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 2;
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.05);
        }

        /* 상단 텍스트 검색 창 */
        .search-box {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
        }
        #keyword-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        #keyword-input:focus {
            border-color: #4f46e5;
        }
        #search-button {
            padding: 12px 16px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }
        #search-button:hover {
            background-color: #3730a3;
        }

        /* 상단 카테고리 스위칭 탭 */
        .tab-container {
            display: flex;
            background-color: #f1f5f9;
            padding: 4px;
            border-radius: 8px;
            gap: 4px;
            margin-bottom: 15px;
        }
        .tab-button {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-button.active {
            background-color: #ffffff;
            color: #4f46e5;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        /* 동적 검색 결과 리스트 (내부 독립 스크롤 적용) */
        #places-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }
        .place-item {
            padding: 15px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background-color: white;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .place-item:hover {
            background-color: #f8fafc;
            border-color: #cbd5e1;
        }
        .place-title {
            font-size: 15px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 5px;
        }
        .place-address {
            font-size: 12px;
            color: #64748b;
            line-height: 1.4;
        }

        /* 🗺️ 3. 오른쪽 지도 영역 */
        #map {
            flex: 1;
            height: 100%;
            z-index: 1;
        }

        /* 📍 4. 예쁜 디자인의 마커 클릭용 커스텀 말풍선(오버레이) */
        .custom-overlay {
            position: relative;
            bottom: 55px;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border: 1px solid #e2e8f0;
            min-width: 230px;
            overflow: hidden;
        }
        .custom-overlay .title-bar {
            display: block;
            background: #4f46e5;
            color: white;
            padding: 10px 35px 10px 14px;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .custom-overlay .body-content {
            padding: 12px 14px;
            font-size: 13px;
        }
        .custom-overlay .phone-number {
            margin-bottom: 10px;
            color: #475569;
        }
        .custom-overlay .map-link {
            display: block;
            text-align: center;
            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
            background: #f4f3ff;
            padding: 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .custom-overlay .map-link:hover {
            background: #e0e7ff;
        }
        .custom-overlay .close-button {
            position: absolute;
            top: 10px;
            right: 12px;
            color: rgba(255, 255, 255, 0.8);
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .custom-overlay .close-button:hover {
            color: white;
        }
        /* 말풍선 아래 하단 삼각형 꼬리 */
        .custom-overlay::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="sidebar">
            <div class="search-box">
                <input type="text" id="keyword-input" placeholder="원하는 지역이나 장소를 검색해보세요!" onkeypress="if(event.keyCode==13) searchByKeyword();">
                <button id="search-button" onclick="searchByKeyword()">검색</button>
            </div>

            <div class="tab-container">
                <button id="tab-theater" class="tab-button active" onclick="switchCategory('CT1', this)">🎫 극장</button>
                <button id="tab-subway" class="tab-button" onclick="switchCategory('SW8', this)">🚇 지하철역</button>
            </div>

            <ul id="places-list"></ul>
        </div>

        <div id="map"></div>
    </div>

    <script>
        // 전역 관리 변수 인스턴스
        let map; // 카카오 지도 핵심 객체
        let placeService; // 카카오 장소 카테고리/키워드 서비스 모듈
        let currentCategory = 'CT1'; // 활성화 상태 저장용 카테고리 코드 (기본값: 극장)
        let markers = []; // 현재 지도에 출력 상태인 장소 마커 배열
        let currentOverlay = null; // 활성화되어 노출 중인 커스텀 말풍선 객체

        // 브라우저 텍스트 이모지(Emoji) 컴포넌트를 기반으로 벡터(SVG) 마커 핀 이미지를 만드는 함수
        function createEmojiMarkerImage(emoji) {
            const svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="white" stroke="#4f46e5" stroke-width="3"/><text x="50%" y="55%" font-size="20" text-anchor="middle" dominant-baseline="middle">${emoji}</text></svg>`;
            const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
            const imageSize = new kakao.maps.Size(44, 44);
            const imageOption = { offset: new kakao.maps.Point(22, 22) };
            return new kakao.maps.MarkerImage(svgUrl, imageSize, imageOption);
        }

        // 카테고리 맵 구조 사전 정의 데이터셋
        const markerEmojis = {
            'CT1': '🎫',  // 극장용 티켓 이모지
            'SW8': '🚇',  // 지하철역용 이모지
            'USER': '👥' // 내 현재 위치용 관객 이모지
        };

        // 지도 핵심 제어 인터페이스 초기화 함수
        function initMap() {
            const container = document.getElementById('map');
            const options = {
                center: new kakao.maps.LatLng(37.582191, 127.001877), // 위치 권한 수락 전 대기 중심 위치 (대학로 혜화역 인근)
                level: 5 // 요구 사양: 확대 레벨 5 지정
            };

            map = new kakao.maps.Map(container, options);
            placeService = new kakao.maps.services.Places(map);

            // 중요: 페이지 첫 진입 시 위치 추적 팝업 강제 작동 호출
            requestUserLocation();

            // 디폴트 극장 데이터 즉시 쿼리 수집
            searchCategoryPlaces();

            // 지도가 이동을 멈출 때마다(Idle 상태) 현재 카메라 중심점으로 재주변 탐색 동기화 리스너
            kakao.maps.event.addListener(map, 'idle', function() {
                searchCategoryPlaces();
            });
        }

        // 브라우저 GPS 모듈을 가동하여 사용자 동의 권한을 요구하는 함수
        function requestUserLocation() {
            if (navigator.geolocation) {
                // 이 빌트인 라인이 구동되는 환경(localhost 혹은 정식 도메인)에서 브라우저 권한 팝업을 띄움
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const userPosition = new kakao.maps.LatLng(lat, lng);

                    // 위치 획득 성공 시 지도 포커스를 내 위치로 세팅
                    map.setCenter(userPosition);

                    // 내 좌표에 관객 이모지(👥) 적용 마커 표시
                    const userMarker = new kakao.maps.Marker({
                        position: userPosition,
                        image: createEmojiMarkerImage(markerEmojis['USER']),
                        zIndex: 5 // 다른 일반 장소 핀에 가려지지 않게 최상단 계층으로 고정
                    });
                    userMarker.setMap(map);

                    // 동기화된 내 위치를 바탕으로 주변 정보 새로고침
                    searchCategoryPlaces();
                }, function(error) {
                    console.warn("사용자가 위치 동의를 거부했거나 오류가 발생해 기본 대학로 지도로 시작합니다.", error.message);
                });
            }
        }

        // 직접 텍스트를 입력해서 지역을 수동 포커싱하는 검색 보조 함수
        function searchByKeyword() {
            const keyword = document.getElementById('keyword-input').value.trim();
            if (!keyword) {
                alert('검색어를 입력해주세요!');
                return;
            }

            placeService.keywordSearch(keyword, function(data, status) {
                if (status === kakao.maps.services.Status.OK) {
                    const firstPlace = data[0];
                    const movePosition = new kakao.maps.LatLng(firstPlace.y, firstPlace.x);
                    map.setCenter(movePosition);
                    closeOverlay();
                } else {
                    alert('검색 결과가 존재하지 않습니다.');
                }
            });
        }

        // 극장과 지하철역 카테고리를 스위칭해주는 제어 탭 함수
        function switchCategory(categoryCode, element) {
            if (currentCategory === categoryCode) return; // 동일한 탭 중복 연타 시 실행 스킵

            currentCategory = categoryCode;

            // 전체 액티브 스타일 해제 및 선택 버튼 스타일 점등
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            // 요구 조건: 기존 지도 화면 마커 청소 및 활성화 말풍선 완벽히 청산하기
            clearMarkers();
            closeOverlay();

            // 교체된 카테고리를 기반으로 주변 데이터 재스캔
            searchCategoryPlaces();
        }

        // 현재 지도 중심점을 기준으로 2km 이내의 카테고리 대상을 불러오는 비동기 데이터 래핑 함수
        function searchCategoryPlaces() {
            if (!placeService || !map) return;

            placeService.categorySearch(currentCategory, function(data, status) {
                if (status === kakao.maps.services.Status.OK) {
                    clearMarkers(); // 이전 라운드 마커 삭제
                    
                    const listEl = document.getElementById('places-list');
                    listEl.innerHTML = ''; // 왼쪽 목록 초기화

                    // 취득한 장소 정보 개수만큼 마커와 UI 레이아웃 동적 드로잉
                    for (let i = 0; i < data.length; i++) {
                        displayPlaceItem(data[i]);
                    }
                } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                    clearMarkers();
                    document.getElementById('places-list').innerHTML = '<li style="text-align:center;color:#64748b;font-size:13px;padding:30px;">주변에 검색 정보가 존재하지 않습니다.</li>';
                }
            }, {
                location: map.getCenter(),
                radius: 2000, // 반경 범위 2km 지정
                useMapCenter: true
            });
        }

        // 지도 핀 장소 객체 할당 및 렌더링 세부 구현부 함수
        function displayPlaceItem(place) {
            const markerPosition = new kakao.maps.LatLng(place.y, place.x);
            // 선택된 카테고리에 알맞은 커스텀 디자인 이모지 이미지 연결
            const markerImage = createEmojiMarkerImage(markerEmojis[currentCategory]);

            // 마커 선언 및 바인딩
            const marker = new kakao.maps.Marker({
                position: markerPosition,
                image: markerImage
            });
            marker.setMap(map);
            markers.push(marker);

            // 요구 사양: 클릭 시 오픈할 장소명, 전화번호, 카카오맵 전용 이동 링크 템플릿 스트링 작성
            const contentString = `
                <div class="custom-overlay">
                    <span class="title-bar">${place.place_name}</span>
                    <button class="close-button" onclick="closeOverlay()">✕</button>
                    <div class="body-content">
                        <div class="phone-number">📞 ${place.phone ? place.phone : '등록된 번호 없음'}</div>
                        <a href="${place.place_url}" target="_blank" class="map-link">카카오맵 상세정보</a>
                    </div>
                </div>
            `;

            // 마커 클릭 시 예쁜 커스텀 오버레이를 지도에 띄우는 리스너 추가
            kakao.maps.event.addListener(marker, 'click', function() {
                if (currentOverlay) currentOverlay.setMap(null); // 다른 마커 말풍선은 사전 소멸

                const overlay = new kakao.maps.CustomOverlay({
                    content: contentString,
                    position: markerPosition,
                    xAnchor: 0.5,
                    yAnchor: 1.0
                });
                overlay.setMap(map);
                currentOverlay = overlay;
            });

            // 왼쪽 사이드바 목록 요소 동적 생성 부분
            const listEl = document.getElementById('places-list');
            const itemEl = document.createElement('li');
            itemEl.className = 'place-item';
            itemEl.innerHTML = `
                <div class="place-title">${place.place_name}</div>
                <div class="place-address">${place.road_address_name ? place.road_address_name : place.address_name}</div>
            `;

            // 리스트 영역의 아이템 클릭 시 지도 포커스를 옮기고 연결된 마커를 원격 강제 클릭 작동 트리거
            itemEl.onclick = function() {
                map.setCenter(markerPosition);
                kakao.maps.event.trigger(marker, 'click');
            };

            listEl.appendChild(itemEl);
        }

        // 활성화된 말풍선을 지도 위에서 소거하는 함수
        function closeOverlay() {
            if (currentOverlay) {
                currentOverlay.setMap(null);
                currentOverlay = null;
            }
        }

        // 마커 풀 세트를 지도에서 은닉 폐기하는 함수
        function clearMarkers() {
            for (let i = 0; i < markers.length; i++) {
                if (markers[i]) markers[i].setMap(null);
            }
            markers = [];
        }

        // 화면 돔 트리 구조 준비 완료 확인 후 안전하게 카카오 API 호출 콜백
        window.addEventListener('DOMContentLoaded', function() {
            kakao.maps.load(initMap);
        });
    </script>
</body>
</html>
