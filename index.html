<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>내 주변 극장 찾기</title>
    <style>
        /* 화면 레이아웃 및 스타일 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; font-family: 'Malgun Gothic', sans-serif; }

        #main_container { display: flex; width: 100%; height: 100vh; }

        /* 왼쪽 사이드바 (검색창 + 리스트) */
        #sidebar {
            width: 350px;
            background: #ffffff;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 2;
        }

        .search_area { margin-bottom: 20px; display: flex; gap: 5px; }
        #keyword_input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        #search_btn { padding: 10px 15px; background: #ff4d4d; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* 검색 결과 리스트 스타일 */
        #theater_list { list-style: none; overflow-y: auto; flex: 1; }
        #theater_list li { 
            padding: 15px; 
            border-bottom: 1px solid #eee; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        #theater_list li:hover { background: #fff5f5; }
        .place_title { font-weight: bold; color: #e60000; font-size: 16px; }
        .place_addr { font-size: 13px; color: #666; margin-top: 5px; display: block; }

        /* 오른쪽 지도 영역 */
        #map { flex: 1; height: 100%; }

        /* 커스텀 오버레이(이모지 마커) 스타일 */
        .emoji_marker {
            font-size: 30px;
            cursor: pointer;
            text-shadow: 2px 2px 2px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div id="main_container">
    <div id="sidebar">
        <h2 style="margin-bottom:15px;">🎭 극장 찾기</h2>
        <div class="search_area">
            <input type="text" id="keyword_input" placeholder="극장 이름을 입력하세요" onkeypress="if(event.keyCode==13) searchTheaters();">
            <button id="search_btn" onclick="searchTheaters()">검색</button>
        </div>
        <ul id="theater_list"></ul>
    </div>
    <div id="map"></div>
</div>

<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=f04125889d3a23d04286d6f25da3176b&libraries=services"></script>

<script>
    let map;
    let placeSearch; // 장소 검색 객체
    let markers = []; // 마커 관리 배열
    let infoWindow = new kakao.maps.InfoWindow({ zIndex: 1 }); // 정보창

    // 지도가 완전히 로드된 후 실행
    kakao.maps.load(function() {
        const mapContainer = document.getElementById('map');
        const mapOptions = {
            center: new kakao.maps.LatLng(37.566826, 126.9786567), // 기본 위치
            level: 5
        };

        map = new kakao.maps.Map(mapContainer, mapOptions);
        placeSearch = new kakao.maps.services.Places();

        // 현재 위치 요청
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const currentLatLng = new kakao.maps.LatLng(position.coords.latitude, position.coords.longitude);
                map.setCenter(currentLatLng);
            });
        }
    });

    // 검색 실행 함수
    function searchTheaters() {
        const keyword = document.getElementById('keyword_input').value;

        if (!keyword.trim()) {
            alert('검색어를 입력해주세요!');
            return;
        }

        // 카카오 장소 검색 실행
        placeSearch.keywordSearch(keyword, searchCallback);
    }

    // 장소 검색 결과 콜백
    function searchCallback(data, status) {
        if (status === kakao.maps.services.Status.OK) {
            displayPlaces(data);
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            alert('검색 결과가 없습니다.');
        } else {
            alert('오류가 발생했습니다.');
        }
    }

    // 장소 표시 함수
    function displayPlaces(places) {
        const listEl = document.getElementById('theater_list');
        const bounds = new kakao.maps.LatLngBounds();

        // 1. 기존 리스트와 마커 지우기
        listEl.innerHTML = '';
        clearMarkers();

        for (let i = 0; i < places.length; i++) {
            const position = new kakao.maps.LatLng(places[i].y, places[i].x);
            
            // 2. 이모지 마커(커스텀 오버레이) 만들기
            const markerContent = document.createElement('div');
            markerContent.className = 'emoji_marker';
            markerContent.innerHTML = '🎭';
            
            const customOverlay = new kakao.maps.CustomOverlay({
                position: position,
                content: markerContent,
                map: map
            });

            // 3. 마커 클릭 시 정보 팝업(InfoWindow) 표시
            markerContent.onclick = function() {
                const content = `
                    <div style="padding:10px; min-width:150px;">
                        <div style="font-weight:bold;">${places[i].place_name}</div>
                        <div style="font-size:12px; color:#666; margin-top:5px;">${places[i].address_name}</div>
                    </div>`;
                infoWindow.setContent(content);
                infoWindow.open(map, customOverlay);
            };

            markers.push(customOverlay);

            // 4. 왼쪽 리스트 아이템 추가
            const itemEl = createListItem(places[i]);
            itemEl.onclick = function() {
                map.panTo(position); // 클릭 시 해당 위치로 부드럽게 이동
            };
            listEl.appendChild(itemEl);

            bounds.extend(position);
        }

        // 검색된 장소들이 모두 보이도록 지도 범위 조정
        map.setBounds(bounds);
    }

    // 리스트 아이템 생성 함수
    function createListItem(place) {
        const li = document.createElement('li');
        li.innerHTML = `
            <span class="place_title">${place.place_name}</span>
            <span class="place_addr">${place.road_address_name || place.address_name}</span>
        `;
        return li;
    }

    // 기존 마커(오버레이) 제거 함수
    function clearMarkers() {
        for (let i = 0; i < markers.length; i++) {
            markers[i].setMap(null);
        }
        markers = [];
        infoWindow.close();
    }
</script>

</body>
</html>
