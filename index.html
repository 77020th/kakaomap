<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎭 대학로 연극·뮤지컬 극장 지도</title>
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=94cff6c2e858861851aa038ebb76d145&libraries=services&autoload=false"></script>
    <style>
        /* 🎨 1. 디자인 컨셉: '글래모피즘'과 '인디고 블루' 트렌디 리뉴얼 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Malgun Gothic";
            overflow: hidden;
            background-color: #f0f2f5;
        }

        /* 화면 좌우 2분할 컨테이너 */
        #main-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* 🔍 2. 왼쪽 사이드바 (반투명 유리 질감 적용) */
        #sidebar {
            width: 380px;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            padding: 25px;
            z-index: 10;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.08);
        }

        /* 검색창 디자인 */
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        #keyword-input {
            flex: 1;
            padding: 14px;
            border: 2px solid #e0e6ed;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
            color: #333;
        }
        #keyword-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.15);
        }
        #search-button {
            padding: 14px 20px;
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.2s ease;
        }
        #search-button:hover {
            background-color: #4f46e5;
            transform: translateY(-1px);
        }

        /* 카테고리 탭 디자인 */
        .tab-container {
            display: flex;
            background-color: #f1f5f9;
            padding: 6px;
            border-radius: 14px;
            gap: 6px;
            margin-bottom: 20px;
        }
        .tab-button {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            color: #718093;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .tab-button.active {
            background-color: white;
            color: #6366f1;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        /* 결과 리스트 영역 (둥근 카드 형태 디자인) */
        #places-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }
        #places-list::-webkit-scrollbar {
            width: 8px;
        }
        #places-list::-webkit-scrollbar-thumb {
            background-color: #e0e6ed;
            border-radius: 4px;
        }
        .place-item {
            padding: 18px;
            border: 1px solid rgba(0, 0, 0, 0.03);
            background-color: white;
            margin-bottom: 12px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
        }
        .place-item:hover {
            background-color: #fbfbfe;
            border-color: #e0dfff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.08);
        }
        .place-title {
            font-size: 17px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 6px;
        }
        .place-address {
            font-size: 13px;
            color: #64748b;
            line-height: 1.4;
        }

        /* 🗺️ 3. 오른쪽 지도 영역 */
        #map {
            flex: 1;
            height: 100%;
        }

        /* 📍 4. 예쁜 커스텀 말풍선(오버레이) 디자인 및 통통 튀는 애니메이션 */
        .custom-overlay {
            position: relative;
            bottom: 60px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 250px;
            overflow: hidden;
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            from { transform: scale(0.9) translateY(10px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        .custom-overlay .title-bar {
            display: block;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            padding: 14px 45px 14px 18px;
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .custom-overlay .body-content {
            padding: 16px 18px;
            font-size: 14px;
            color: #333;
        }
        .custom-overlay .phone-number {
            margin-bottom: 12px;
            color: #555;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .custom-overlay .map-link {
            display: block;
            text-align: center;
            color: #6366f1;
            text-decoration: none;
            font-weight: bold;
            background: #f0f1ff;
            padding: 10px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }
        .custom-overlay .map-link:hover {
            background: #e1e4ff;
        }
        .custom-overlay .close-button {
            position: absolute;
            top: 14px;
            right: 15px;
            color: rgba(255, 255, 255, 0.9);
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            padding: 0;
            line-height: 1;
        }
        .custom-overlay .close-button:hover {
            color: white;
        }
        /* 말풍선 꼬리 장식 */
        .custom-overlay::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="sidebar">
            <div class="search-box">
                <input type="text" id="keyword-input" placeholder="역 이름이나 지역을 검색해 보세요!" onkeypress="if(event.keyCode==13) searchByKeyword();">
                <button id="search-button" onclick="searchByKeyword()">검색</button>
            </div>

            <div class="tab-container">
                <button id="tab-theater" class="tab-button active" onclick="switchCategory('CT1', this)">🎫 극장</button>
                <button id="tab-subway" class="tab-button" onclick="switchCategory('SW8', this)">🚇 지하철역</button>
            </div>

            <ul id="places-list"></ul>
        </div>

        <div id="map"></div>
    </div>

    <script>
        // 전역 변수 모음
        let map; // 카카오 지도 객체
        let placeService; // 장소 검색용 서비스 객체
        let currentCategory = 'CT1'; // 현재 활성화된 카테고리 코드 (기본값: 극장)
        let markers = []; // 지도에 그려진 장소 마커 배열
        let currentOverlay = null; // 현재 지도에 띄워진 커스텀 말풍선 객체

        // 이모지를 지도 마커 아이콘(SVG 이미지 데이터)으로 변환하는 함수
        function createEmojiMarker(emoji) {
            const svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="white" stroke="#6366f1" stroke-width="4"/><text x="50%" y="60%" font-size="24" text-anchor="middle" dominant-baseline="middle">${emoji}</text></svg>`;
            const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
            const imageSize = new kakao.maps.Size(48, 48);
            const imageOption = { offset: new kakao.maps.Point(24, 24) };
            return new kakao.maps.MarkerImage(svgUrl, imageSize, imageOption);
        }

        // 카테고리별 매핑 이모지 데이터셋
        const markerEmojis = {
            'CT1': '🎫', // 극장
            'SW8': '🚇', // 지하철역
            'USER': '👥' // 관객 (내 현재 위치)
        };

        // 지도 생성 및 서비스 연동 초기화 함수
        function initMap() {
            const container = document.getElementById('map');
            const options = {
                center: new kakao.maps.LatLng(37.582191, 127.001877), // 위치 권한 허용 전 기본 위치 (대학로 혜화역)
                level: 5 // 지도 확대 레벨 5 설정
            };

            map = new kakao.maps.Map(container, options);
            placeService = new kakao.maps.services.Places(map);

            // 페이지 로드 즉시 상단에 위치 권한 팝업 호출 실행
            requestUserLocation();

            // 주변 카테고리 검색 즉시 발동
            searchCategoryPlaces();

            // 지도를 움직여서 멈췄을 때 이동한 중심점 기준으로 주변을 재검색하는 이벤트 리스너 추가
            kakao.maps.event.addListener(map, 'idle', function() {
                searchCategoryPlaces();
            });
        }

        // 브라우저에 GPS 현재 위치를 요청해 지도 중심을 바꾸는 함수
        function requestUserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const userPosition = new kakao.maps.LatLng(lat, lng);

                    // 위치 동의 시 지도의 중심을 내 GPS 위치로 변경
                    map.setCenter(userPosition);

                    // 내 위치에 관객 이모지(👥) 마커 꽂기
                    const userMarker = new kakao.maps.Marker({
                        position: userPosition,
                        image: createEmojiMarker(markerEmojis['USER']),
                        zIndex: 5
                    });
                    userMarker.setMap(map);

                    // 내 위치 기준으로 주변 장소 검색 새로고침
                    searchCategoryPlaces();
                }, function(error) {
                    console.warn("위치 서비스 권한이 거부되어 기본 대학로 좌표로 구동합니다.", error.message);
                });
            }
        }

        // 키워드로 장소를 직접 찾아서 이동하는 함수
        function searchByKeyword() {
            const keyword = document.getElementById('keyword-input').value.trim();
            if (!keyword) {
                alert('검색어를 입력해 주세요!');
                return;
            }

            placeService.keywordSearch(keyword, function(data, status) {
                if (status === kakao.maps.services.Status.OK) {
                    const firstPlace = data[0];
                    const movePosition = new kakao.maps.LatLng(firstPlace.y, firstPlace.x);
                    map.setCenter(movePosition);
                    closeOverlay();
                } else {
                    alert('검색 결과가 없습니다. 다시 확인해 보세요!');
                }
            });
        }

        // 극장 🎫 또는 지하철역 🚇 탭 스위칭 매커니즘 함수
        function switchCategory(categoryCode, element) {
            if (currentCategory === categoryCode) return;

            currentCategory = categoryCode;

            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            clearMarkers();
            closeOverlay();

            searchCategoryPlaces();
        }

        // 현재 지도 중심 좌표점 기준으로 주변 2km 카테고리 데이터 수집 함수
        function searchCategoryPlaces() {
            if (!placeService || !map) return;

            placeService.categorySearch(currentCategory, function(data, status) {
                if (status === kakao.maps.services.Status.OK) {
                    clearMarkers();
                    
                    const listEl = document.getElementById('places-list');
                    listEl.innerHTML = '';

                    for (let i = 0; i < data.length; i++) {
                        displayPlaceItem(data[i]);
                    }
                } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                    clearMarkers();
                    document.getElementById('places-list').innerHTML = '<li style="text-align:center;color:#64748b;font-size:13px;padding:20px;">주변에 검색 결과가 없어요.</li>';
                }
            }, {
                location: map.getCenter(),
                radius: 2000,
                useMapCenter: true
            });
        }

        // 장소 마커 생성, 말풍선 바인딩 및 왼쪽 리스트 요소 렌더링 함수
        function displayPlaceItem(place) {
            const markerPosition = new kakao.maps.LatLng(place.y, place.x);
            const markerImage = createEmojiMarker(markerEmojis[currentCategory]);

            const marker = new kakao.maps.Marker({
                position: markerPosition,
                image: markerImage
            });
            marker.setMap(map);
            markers.push(marker);

            const contentString = `
                <div class="custom-overlay">
                    <span class="title-bar">${place.place_name}</span>
                    <button class="close-button" onclick="closeOverlay()">✕</button>
                    <div class="body-content">
                        <div class="phone-number">📞 ${place.phone ? place.phone : '전화번호 없음'}</div>
                        <a href="${place.place_url}" target="_blank" class="map-link">카카오맵 바로가기</a>
                    </div>
                </div>
            `;

            kakao.maps.event.addListener(marker, 'click', function() {
                if (currentOverlay) currentOverlay.setMap(null);

                const overlay = new kakao.maps.CustomOverlay({
                    content: contentString,
                    position: markerPosition,
                    xAnchor: 0.5,
                    yAnchor: 1.0
                });
                overlay.setMap(map);
                currentOverlay = overlay;
            });

            const listEl = document.getElementById('places-list');
            const itemEl = document.createElement('li');
            itemEl.className = 'place-item';
            itemEl.innerHTML = `
                <div class="place-title">${place.place_name}</div>
                <div class="place-address">${place.road_address_name ? place.road_address_name : place.address_name}</div>
            `;

            itemEl.onclick = function() {
                map.setCenter(markerPosition);
                kakao.maps.event.trigger(marker, 'click');
            };

            listEl.appendChild(itemEl);
        }

        // 열려있는 커스텀 말풍선을 삭제하는 닫기 함수
        function closeOverlay() {
            if (currentOverlay) {
                currentOverlay.setMap(null);
                currentOverlay = null;
            }
        }

        // 지도 위 장소 마커들을 일괄 청소하는 함수
        function clearMarkers() {
            for (let i = 0; i < markers.length; i++) {
                if (markers[i]) markers[i].setMap(null);
            }
            markers = [];
        }

        // 💡 안전장치 보완: 카카오 라이브러리가 존재할 때만 실행하도록 체크 로직 강화
        window.addEventListener('DOMContentLoaded', function() {
            if (typeof kakao !== 'undefined' && kakao.maps) {
                kakao.maps.load(initMap);
            } else {
                console.error("카카오 맵 API 스크립트가 정상적으로 로드되지 않았습니다. 카카오 개발자 센터의 [플랫폼 > Web 도메인] 설정을 확인해주세요.");
            }
        });
    </script>
</body>
</html>
