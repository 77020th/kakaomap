<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎭 연극·뮤지컬 극장 지도</title>
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=7faecf0c3c7898e25541b12dcb4e2cf2&libraries=services&autoload=false"></script>
    <style>
        /* 🎨 기본 스타일 리셋 및 세련된 폰트 적용 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f5f6fa;
        }
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* 🔍 왼쪽 메뉴 컨트롤러 디자인 업그레이드 */
        #menu-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 320px;
            box-sizing: border-box;
        }
        /* 검색창 컴포넌트 */
        .search-box-container {
            display: flex;
            margin-bottom: 15px;
            background: #f1f2f6;
            border-radius: 12px;
            padding: 4px;
        }
        .search-input {
            flex: 1;
            padding: 10px 12px;
            border: none;
            background: transparent;
            font-size: 14px;
            outline: none;
            color: #2f3640;
        }
        .search-button {
            padding: 10px 16px;
            background: #6c5ce7;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }
        .search-button:hover {
            background: #5b4cc4;
        }
        /* 탭 버튼 스타일 */
        .tab-button-container {
            display: flex;
            background: #f1f2f6;
            border-radius: 12px;
            padding: 4px;
            gap: 4px;
        }
        .tab-button {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #718093;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .tab-button.active {
            background: white;
            color: #6c5ce7;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }
        /* 📍 예쁜 커스텀 말풍선(오버레이) 디자인 */
        .custom-overlay {
            position: relative;
            bottom: 55px;
            border-radius: 14px;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(0,0,0,0.18);
            border: 1px solid rgba(0,0,0,0.06);
            min-width: 200px;
            overflow: hidden;
            animation: pop 0.2s ease-out;
        }
        @keyframes pop {
            from { transform: scale(0.9) translateY(10px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        .custom-overlay .title {
            display: block;
            background: #6c5ce7;
            color: white;
            padding: 12px 35px 12px 16px;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .custom-overlay .body {
            padding: 14px 16px;
            font-size: 13px;
            background: white;
        }
        .custom-overlay .phone {
            margin-bottom: 10px;
            color: #718093;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .custom-overlay .link {
            display: block;
            text-align: center;
            color: #6c5ce7;
            text-decoration: none;
            font-weight: bold;
            background: #f1f0fe;
            padding: 8px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .custom-overlay .link:hover {
            background: #e1dffd;
        }
        .custom-overlay .close-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            color: rgba(255, 255, 255, 0.8);
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            padding: 0;
            line-height: 1;
        }
        .custom-overlay .close-btn:hover {
            color: white;
        }
        /* 말풍선 꼬리 */
        .custom-overlay::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="menu-container">
        <div class="search-box-container">
            <input type="text" id="keyword-input" class="search-input" placeholder="지역 이름이나 역 이름을 검색!" onkeypress="if(event.keyCode==13) keywordSearch();">
            <button class="search-button" onclick="keywordSearch()">검색</button>
        </div>

        <div class="tab-button-container">
            <button class="tab-button active" onclick="switchTab('CT1', this)">🎫 극장</button>
            <button class="tab-button" onclick="switchTab('SW8', this)">🚇 지하철역</button>
        </div>
    </div>

    <script>
        // 전역 변수 선언
        let map; // 지도 객체
        let placeService; // 장소 검색 서비스 객체
        let currentCategory = 'CT1'; // 현재 활성화된 카테고리 코드
        let markers = []; // 생성된 마커들을 보관할 배열
        let currentOverlay = null; // 현재 지도에 열려있는 말풍선 객체

        // 이모지를 카카오맵 마커용 이미지(SVG 데이터)로 바꾸는 함수
        function createEmojiMarkerImage(emoji) {
            const svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="white" stroke="#6c5ce7" stroke-width="3" opacity="0.9"/><text x="50%" y="55%" font-size="22" text-anchor="middle" dominant-baseline="middle">${emoji}</text></svg>`;
            const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
            const imageSize = new kakao.maps.Size(44, 44);
            const imageOption = { offset: new kakao.maps.Point(22, 22) };
            return new kakao.maps.MarkerImage(svgUrl, imageSize, imageOption);
        }

        // 카테고리별 이모지 데이터 매핑
        const categoryEmojis = {
            'CT1': '🎫', // 극장
            'SW8': '🚇', // 지하철역
            'USER': '👥' // 내 현재 위치 (관객 이모지)
        };

        // 지도 및 서비스 초기화 실행 함수
        function initMap() {
            const container = document.getElementById('map');
            const options = {
                center: new kakao.maps.LatLng(37.582191, 127.001877), // 기본 좌표 (대학로 혜화역)
                level: 4 // 지도 확대 수준
            };

            // 지도 생성
            map = new kakao.maps.Map(container, options);
            // 장소 검색 서비스 객체 생성
            placeService = new kakao.maps.services.Places(map);

            // 팝업 연동: 사이트 입장하자마자 내 위치 추적 권한 요청 시작
            requestUserLocation();

            // 기본 위치 기준으로 주변 카테고리 장소 검색
            searchPlaces();

            // 지도를 드래그해서 움직임이 멈췄을 때 주변 장소를 새로고침해주는 이벤트 등록
            kakao.maps.event.addListener(map, 'idle', function() {
                searchPlaces();
            });
        }

        // 처음 입장 시 현재 위치 허용 팝업 띄우기 및 내 위치 마커 표시
        function requestUserLocation() {
            if (navigator.geolocation) {
                // 브라우저 권한 팝업 발동
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const userPosition = new kakao.maps.LatLng(lat, lng);

                    // 위치 승인 시 지도의 중심을 내 위치로 부드럽게 이동
                    map.setCenter(userPosition);

                    // 내 위치에 관객 이모지(👥) 마커 꽂기
                    const userMarker = new kakao.maps.Marker({
                        position: userPosition,
                        image: createEmojiMarkerImage(categoryEmojis['USER']),
                        zIndex: 5
                    });
                    userMarker.setMap(map);

                    // 내 위치 주변 검색 다시 작동
                    searchPlaces();
                }, function(error) {
                    console.warn("위치 정보 권한이 거부되었거나 차단되어 기본 위치(대학로)로 시작합니다.", error.message);
                });
            } else {
                console.warn("이 브라우저는 Geolocation 위치 추적을 지원하지 않습니다.");
            }
        }

        // 키워드 직접 검색 기능 (예: '강남역', '홍대' 입력 후 검색 버튼 클릭 시)
        function keywordSearch() {
            const keyword = document.getElementById('keyword-input').value.trim();
            if (!keyword) {
                alert('검색어를 입력해 주세요!');
                return;
            }

            placeService.keywordSearch(keyword, function(data, status) {
                if (status === kakao.maps.services.Status.OK) {
                    // 제일 첫 번째로 검색된 검색 장소 좌표로 이동
                    const firstPlace = data[0];
                    const movePosition = new kakao.maps.LatLng(firstPlace.y, firstPlace.x);
                    map.setCenter(movePosition);
                    closeOverlay();
                } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                    alert('검색 결과가 없습니다. 정확한 지역명이나 역 이름을 입력해 보세요!');
                } else {
                    alert('검색 중 오류가 발생했습니다.');
                }
            });
        }

        // 탭 버튼 클릭 전환 함수
        function switchTab(categoryCode, element) {
            if (currentCategory === categoryCode) return; // 같은 탭이면 작동 안 함

            currentCategory = categoryCode;

            // 기존 활성화된 탭 스타일 제거하고 선택한 탭 활성화
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            // 기존 마커와 팝업 말풍선 깨끗하게 지우기
            removeMarkers();
            closeOverlay();

            // 새로 바뀐 카테고리로 주변 장소 다시 찾기
            searchPlaces();
        }

        // 현재 지도 중심점 기준으로 반경 2km 이내 카테고리 장소 검색 함수
        function searchPlaces() {
            if (!placeService || !map) return;

            placeService.categorySearch(currentCategory, function(data, status) {
                if (status === kakao.maps.services.Status.OK) {
                    removeMarkers(); // 기존 검색된 마커들 초기화
                    
                    // 새로
