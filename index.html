<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>고등학생 코딩: 장소 검색 서비스</title>
    <style>
        /* CSS: 화면 레이아웃 설정 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; font-family: 'Malgun Gothic', sans-serif; }

        /* 메인 컨테이너: 왼쪽 메뉴와 오른쪽 지도를 가로로 배치 */
        #main_container { display: flex; width: 100%; height: 100vh; }

        /* 왼쪽 사이드바 영역 */
        #menu_wrap {
            width: 350px;
            background: #f8f9fa;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .search_section { margin-bottom: 20px; }
        #keyword { width: 70%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        #search_btn { width: 25%; padding: 10px; background: #fee500; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* 검색 결과 리스트 스타일 */
        #results_list { list-style: none; overflow-y: auto; flex: 1; }
        #results_list li { padding: 15px 10px; border-bottom: 1px solid #eee; cursor: pointer; transition: 0.2s; }
        #results_list li:hover { background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .place_name { font-weight: bold; color: #333; display: block; }
        .place_address { font-size: 13px; color: #777; margin-top: 5px; display: block; }

        /* 오른쪽 지도 영역 */
        #map { flex: 1; height: 100%; }
    </style>
</head>
<body>

<div id="main_container">
    <div id="menu_wrap">
        <div class="search_section">
            <input type="text" id="keyword" placeholder="장소 입력 (예: 강남역)" onkeypress="if(event.keyCode==13) searchPlaces();">
            <button id="search_btn" onclick="searchPlaces()">검색</button>
        </div>
        <ul id="results_list"></ul>
    </div>

    <div id="map"></div>
</div>

<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=f04125889d3a23d04286d6f25da3176b&libraries=services"></script>

<script>
    // JS: 지도 및 서비스 객체 변수
    let map;
    let placeService;
    let markers = []; // 생성된 마커들을 관리할 배열

    // 1. 지도가 로드된 후 실행되도록 kakao.maps.load 사용
    kakao.maps.load(function() {
        const container = document.getElementById('map');
        const options = {
            center: new kakao.maps.LatLng(37.566826, 126.9786567), // 위치 권한 허용 전 기본 위치(서울)
            level: 5 // 지도 확대 레벨
        };

        // 지도 생성
        map = new kakao.maps.Map(container, options);
        
        // 장소 검색 객체 생성
        placeService = new kakao.maps.services.Places();

        // 2. 현재 위치 가져오기 시도
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const currentPos = new kakao.maps.LatLng(lat, lon);

                // 현재 위치로 지도 중심 이동 및 표시
                map.setCenter(currentPos);
                displayCurrentLocationMarker(currentPos);
            });
        }
    });

    // 현재 위치에 특별한 마커 표시
    function displayCurrentLocationMarker(position) {
        const marker = new kakao.maps.Marker({
            position: position,
            map: map
        });
        const infoWindow = new kakao.maps.InfoWindow({ content: '<div style="padding:5px; font-size:12px;">현재 위치</div>' });
        infoWindow.open(map, marker);
    }

    // 장소 검색 실행 함수
    function searchPlaces() {
        const keyword = document.getElementById('keyword').value;

        if (!keyword.replace(/^\s+|\s+$/g, '')) {
            alert('키워드를 입력해주세요!');
            return;
        }

        // 카카오 API 키워드 검색 요청
        placeService.keywordSearch(keyword, placesSearchCallback);
    }

    // 장소 검색 결과 콜백 함수
    function placesSearchCallback(data, status) {
        if (status === kakao.maps.services.Status.OK) {
            displayResults(data);
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            alert('검색 결과가 없습니다.');
        } else {
            alert('검색 중 오류가 발생했습니다.');
        }
    }

    // 검색 결과 리스트 및 마커 표시
    function displayResults(places) {
        const listEl = document.getElementById('results_list');
        const bounds = new kakao.maps.LatLngBounds();

        // 기존 목록 및 마커 제거
        listEl.innerHTML = '';
        removeMarkers();

        for (let i = 0; i < places.length; i++) {
            const placePos = new kakao.maps.LatLng(places[i].y, places[i].x);
            const marker = addMarker(placePos);
            const itemEl = createListItem(places[i]);

            // 리스트 아이템 클릭 시 해당 위치로 이동
            itemEl.onclick = function() {
                map.panTo(placePos);
            };

            listEl.appendChild(itemEl);
            bounds.extend(placePos); // 모든 검색 결과가 보이도록 범위 확장
        }

        // 지도 범위 재설정
        map.setBounds(bounds);
    }

    // 마커 생성 함수
    function addMarker(position) {
        const marker = new kakao.maps.Marker({
            position: position,
            map: map
        });
        markers.push(marker);
        return marker;
    }

    // 마커 초기화 함수
    function removeMarkers() {
        for (let i = 0; i < markers.length; i++) {
            markers[i].setMap(null);
        }
        markers = [];
    }

    // 리스트 아이템 HTML 생성
    function createListItem(place) {
        const li = document.createElement('li');
        li.innerHTML = `
            <span class="place_name">${place.place_name}</span>
            <span class="place_address">${place.road_address_name || place.address_name}</span>
        `;
        return li;
    }
</script>

</body>
</html>
