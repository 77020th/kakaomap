<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎭 대학로 연극·뮤지컬 지도</title>
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=94cff6c2e858861851aa038ebb76d145&libraries=services&autoload=false"></script>
    <style>
        /* 1. 디자인 컨셉: '글래모피즘(Glassmorphism)'과 '인디고 블루' 트렌디 리뉴얼 */
        /* 투명한 질감, 부드러운 그림자, 강렬한 색상을 활용하여 화려함을 강조했습니다. */
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            /* 세련된 고딕 계열 폰트 적용 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Malgun Gothic";
            overflow: hidden;
            background-color: #f0f2f5;
        }

        /* 2분할 플렉스 컨테이너 */
        #container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* 🔍 왼쪽 사이드바: 글래모피즘 디자인 업그레이드 */
        #sidebar {
            width: 380px;
            height: 100%;
            /* 반투명한 질감(Glassmorphism) */
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            padding: 25px;
            z-index: 10;
            /* 부드러운 그림자 효과 */
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.08);
        }

        /* 검색창 컴포넌트 */
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        
        #keyword-input {
            flex: 1;
            padding: 14px;
            border: 2px solid #e0e6ed;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
            color: #333;
        }
        
        #keyword-input:focus {
            border-color: #6366f1; /* Indigo Color 포인트 */
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.15);
        }
        
        #search-button {
            padding: 14px 20px;
            background-color: #6366f1; /* 트렌디한 인디고 컬러 */
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.2s ease;
        }
        
        #search-button:hover {
            background-color: #4f46e5;
            transform: translateY(-1px);
        }

        /* 탭 버튼 스타일: 화려하고 직관적인 디자인 리뉴얼 */
        .tab-container {
            display: flex;
            background-color: #f1f5f9;
            padding: 6px;
            border-radius: 14px;
            gap: 6px;
            margin-bottom: 20px;
        }
        
        .tab-button {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800; /* 글씨 굵게 */
            color: #718093;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .tab-button.active {
            background-color: white;
            color: #6366f1;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        /* 결과 리스트 구역 (스크롤 가능) */
        #places-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }
        
        /* 스크롤바 디자인 */
        #places-list::-webkit-scrollbar {
            width: 8px;
        }
        #places-list::-webkit-scrollbar-thumb {
            background-color: #e0e6ed;
            border-radius: 4px;
        }

        /* 장소 아이템 디자인: 카드 형태로 더욱 예쁘게 */
        .place-item {
            padding: 18px;
            border: 1px solid rgba(0, 0, 0, 0.03);
            background-color: white;
            margin-bottom: 12px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
        }
        
        .place-item:hover {
            background-color: #fbfbfe;
            border-color: #e0dfff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.08);
        }
        
        .place-title {
            font-size: 17px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 6px;
        }
        
        .place-address {
            font-size: 13px;
            color: #64748b;
            line-height: 1.4;
        }

        /* 🗺️ 오른쪽 지도 영역 */
        #map {
            flex: 1;
            height: 100%;
            z-index: 1;
        }

        /* 📍 예쁜 커스텀 말풍선(오버레이) 디자인: 글래모피즘 스타일 적용 */
        .custom-overlay {
            position: relative;
            bottom: 60px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 250px;
            overflow: hidden;
            animation: popIn 0.3s ease-out;
        }
        
        @keyframes popIn {
            from { transform: scale(0.9) translateY(10px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .custom-overlay .title-bar {
            display: block;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            padding: 14px 45px 14px 18px;
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .custom-overlay .body-content {
            padding: 16px 18px;
            font-size: 14px;
            color: #333;
        }
        
        .custom-overlay .phone-number {
            margin-bottom: 12px;
            color: #555;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .custom-overlay .map-link {
            display: block;
            text-align: center;
            color: #6366f1;
            text-decoration: none;
            font-weight: bold;
            background: #f0f1ff;
            padding: 10px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }
        
        .custom-overlay .map-link:hover {
            background: #e1e4ff;
        }
        
        .custom-overlay .close-button {
            position: absolute;
            top: 14px;
            right: 15px;
            color: rgba(255, 255, 255, 0.9);
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            padding: 0;
            line-height: 1;
        }
        
        .custom-overlay .close-button:hover {
            color: white;
        }
        
        /* 말풍선 아래의 삼각형 꼬리 장식 */
        .custom-overlay::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="sidebar">
            <div class="search-box">
                <input type="text" id="keyword-input" placeholder="어디로 갈까요? 지역이나 역 이름 검색!" onkeypress="if(event.keyCode==13) searchByKeyword();">
                <button id="search-button" onclick="searchByKeyword()">검색</button>
            </div>

            <div class="tab-container">
                <button id="tab-theater" class="tab-button active" onclick="switchCategory('CT1', this)"><span>🎫</span> 극장</button>
                <button id="tab-subway" class="tab-button" onclick="switchCategory('SW8', this)"><span>🚇</span> 지하철역</button>
            </div>

            <ul id="places-list">
                </ul>
        </div>

        <div id="map"></div>
    </div>

    <script>
        // 전역 변수 설정
        let map; // 지도 객체
        let placeService; // 장소 검색 서비스 객체
        let currentCategory = 'CT1'; // 현재 선택된 카테고리 코드 (기본값: 극장)
        let markers = []; // 지도에 표시된 일반 마커들을 관리하는 배열
        let activeOverlay = null; // 현재 지도에 열려 있는 커스텀 오버레이 객체

        // 이모지를 지도 마커 핀 이미지(SVG 형태)로 실시간 변환하는 함수
        function createEmojiMarker(emoji) {
            // 이모지를 더 화려하고 트렌디한 원형 핀 그래픽으로 디자인
            const svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="white" stroke="#6366f1" stroke-width="4"/><text x="50%" y="60%" font-size="24" text-anchor="middle" dominant-baseline="middle">${emoji}</text></svg>`;
            const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
            const imageSize = new kakao.maps.Size(48, 48);
            const imageOption = { offset: new kakao.maps.Point(24, 24) };
            return new kakao.maps.MarkerImage(svgUrl, imageSize, imageOption);
        }

        // 카테고리 및 내 위치별 매핑 이모지 데이터
        const markerEmojis = {
            'CT1': '🎫',  // 극장
            'SW8': '🚇',  // 지하철역
            'USER': '👥' // 내 현재 위치 (관객 이모지)
        };

        // 초기화 함수: API가 안전하게 로드된 후 실행됨
        function initMap() {
            const container = document.getElementById('map');
            const options = {
                center: new kakao.maps.LatLng(37.582191, 127.001877), // 위치 권한 허용 전 임시 중심좌표 (대학로 혜화역 인근)
                level: 5 // 지도의 확대 레벨 설정 (요청사항: 5)
            };

            // 지도 생성
            map = new kakao.maps.Map(container, options);

            // 장소 검색 서비스 객체 생성 (기존 생성자에 map 연동 추가)
            placeService = new kakao.maps.services.Places(map);

            // 페이지 열리자마자 브라우저 기본 현재 위치 권한 요청 (Live Server 환경 필수)
            requestUserLocation();

            // 첫 진입 시 기본 카테고리(극장) 데이터 자동 수집
            searchCategoryPlaces();

            // 지도가 드래그 등으로 이동을 멈출 때마다(Idle 상태) 해당 중심점에서 주변 데이터를 재검색하는 리스너
            kakao.maps.event.addListener(map, 'idle', function() {
                searchCategoryPlaces();
            });
        }

        // 브라우저 GPS 모듈을 가동하여 사용자 동의 권한을 요구하는 함수
        function requestUserLocation() {
            if (navigator.geolocation) {
                // 브라우저 위치 권한 허용 팝업 실행
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude; // 위도
                    const lng = position.coords.longitude; // 경도
                    const userPosition = new kakao.maps.LatLng(lat, lng);

                    // 현재 위치를 지도의 중심으로 설정
                    map.setCenter(userPosition);

                    // 내 위치에 관객 이모지(👥) 마커 표시
                    const userMarker = new kakao.maps.Marker({
                        position: userPosition,
                        image: createEmojiMarker(markerEmojis['USER']),
                        zIndex: 5 // 내 위치 마커가 다른 장소 마커 아래로 가려지지 않게 레이어 순위 상향
                    });
                    userMarker.setMap(map);

                    // 획득한 새 중심점 기반으로 주변 카테고리 스캔 데이터 갱신
                    searchCategoryPlaces();

                }, function(error) {
                    console.warn("위치 권한을 획득하지 못해 기본 대학로 위치를 사용합니다.", error.message);
                });
            } else {
                console.warn("이 브라우저에서는 위치 추적(Geolocation)을 지원하지 않습니다.");
            }
        }

        // 텍스트 인풋 입력을 통한 수동 키워드 검색 함수
        function searchByKeyword() {
            const keyword = document.getElementById('keyword-input').value.trim();

            if (!keyword) {
                alert('검색어를 입력해주세요!');
                return;
            }

            // 단순 검색 결과 첫 지점으로 지도 카메라 포커스 이동 처리
            placeService.keywordSearch(keyword, function(data, status) {
                if (status === kakao.maps.services.Status.OK) {
                    const firstPlace = data[0];
                    const movePosition = new kakao.maps.LatLng(firstPlace.y, firstPlace.x);
                    map.setCenter(movePosition);
                    closeOverlay(); // 열려있는 말풍선은 닫기
                } else {
                    alert('검색 결과가 존재하지 않습니다.');
                }
            });
        }

        // 카테고리 탭(극장 <-> 지하철역) 스위칭 제어 함수
        function switchCategory(categoryCode, element) {
            if (currentCategory === categoryCode) return; // 동일한 탭을 반복 클릭할 경우 중단

            currentCategory = categoryCode;

            // 기존 활성화 탭 스타일 제거 및 타겟 버튼 스타일 점등
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            // 탭 변경 시 요구사항: 기존 마커 및 켜져있던 말풍선 소거
            clearMarkers();
            closeOverlay();

            // 교체된 새로운 카테고리로 장소 탐색 시작
            searchCategoryPlaces();
        }

        // 현재 지도 화면 중심 좌표점 기준으로 주변 2km 카테고리 정보를 수집하는 함수
        function searchCategoryPlaces() {
            if (!placeService || !map) return;

            placeService.categorySearch(currentCategory, function(data, status) {
                if (status === kakao.maps.services.Status.OK) {
                    clearMarkers(); // 이전 라운드 마커 폐기
                    
                    const listEl = document.getElementById('places-list');
                    listEl.innerHTML = ''; // 이전 왼쪽 리스트 초기화

                    // 취득한 장소 배열 개수만큼 루프를 돌며 마커와 목록 UI 렌더링
                    for (let i = 0; i < data.length; i++) {
                        displayPlaceItem(data[i]);
                    }
                } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                    clearMarkers();
                    document.getElementById('places-list').innerHTML = '<li style="text-align:center;color:#64748b;font-size:14px;padding:40px;">주변에 검색 결과가 없어요.</li>';
                }
            }, {
                location: map.getCenter(),
                radius: 2000, // 탐색 반경 범위 2km 설정
                useMapCenter: true
            });
        }

        // 지도에 장소 마커를 심고 목록 아이템을 바인딩 렌더링하는 핵심 함수
        function displayPlaceItem(place) {
            const markerPosition = new kakao.maps.LatLng(place.y, place.x);
            // 현재 활성화된 카테고리에 상응하는 화려한 이모지 마커 이미지 추출 할당
            const markerImage = createEmojiMarker(markerEmojis[currentCategory]);

            // 1. 오른쪽에 커스텀 이모지 마커 배치
            const marker = new kakao.maps.Marker({
                position: markerPosition,
                image: markerImage
            });
            marker.setMap(map);
            markers.push(marker); // 일괄 제거 목적 관리 배열 취합

            // 📍 마커 클릭 시 출현할 '화려한 글래모피즘' 말풍선(오버레이) HTML
            const contentString = `
                <div class="custom-overlay">
                    <span class="title-bar">${place.place_name}</span>
                    <button class="close-button" onclick="closeOverlay()">✕</button>
                    <div class="body-content">
                        <div class="phone-number">📞 ${place.phone ? place.phone : '번호 등록 안됨'}</div>
                        <a href="${place.place_url}" target="_blank" class="map-link">카카오맵 바로가기</a>
                    </div>
                </div>
            `;

            // 마커 클릭 시 예쁜 커스텀 오버레이 말풍선을 오픈하는 리스너 장착
            kakao.maps.event.addListener(marker, 'click', function() {
                if (activeOverlay) activeOverlay.setMap(null); // 기존에 다른 마커로 띄워진 오버레이 삭제

                const overlay = new kakao.maps.CustomOverlay({
                    content: contentString,
                    position: markerPosition,
                    xAnchor: 0.5,
                    yAnchor: 1.0
                });
                overlay.setMap(map);
                activeOverlay = overlay;
            });

            // 2. 왼쪽에 매칭 리스트 요소 생성 추가 (카드 형태)
            const listEl = document.getElementById('places-list');
            const itemEl = document.createElement('li');
            itemEl.className = 'place-item';
            itemEl.innerHTML = `
                <div class="place-title">${place.place_name}</div>
                <div class="place-address">${place.road_address_name ? place.road_address_name : place.address_name}</div>
            `;

            // 왼쪽 리스트 목록 클릭 시 지도를 포커스 이동하고 연결된 마커를 원격 강제 클릭 작동 트리거
            itemEl.onclick = function() {
                map.setCenter(markerPosition);
                kakao.maps.event.trigger(marker, 'click');
            };

            listEl.appendChild(itemEl);
        }

        // 현재 떠 있는 커스텀 오버레이 말풍선을 소거하는 함수
        function closeOverlay() {
            if (activeOverlay) {
                activeOverlay.setMap(null);
                activeOverlay = null;
            }
        }

        // 일반 장소 마커 배열 풀을 지도에서 감추고 초기화하는 청소 함수
        function clearMarkers() {
            for (let i = 0; i < markers.length; i++) {
                if (markers[i]) markers[i].setMap(null);
            }
            markers = [];
        }

        // 중요: 브라우저 DOM 구조가 완벽하게 정립된 후 안전하게 카카오 모듈 연동 지시
        window.addEventListener('DOMContentLoaded', function() {
            kakao.maps.load(initMap);
        });
    </script>
</body>
</html>
