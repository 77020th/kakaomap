<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색 서비스</title>
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=94cff6c2e858861851aa038ebb76d145&libraries=services&autoload=false"></script>
    <style>
        /* 기본 스타일 리셋 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
            overflow: hidden;
        }

        /* 2분할 레이아웃 컨테이너 */
        #container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* 왼쪽: 검색 및 결과 영역 (너비 350px) */
        #sidebar {
            width: 350px;
            height: 100%;
            background-color: #ffffff;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            padding: 15px;
            z-index: 2;
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.05);
        }

        /* 검색창 구역 */
        .search-box {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }
        #keyword-input {
            flex: 1;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        #keyword-input:focus {
            border-color: #4f46e5;
        }
        #search-button {
            padding: 11px 16px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        #search-button:hover {
            background-color: #3730a3;
        }

        /* 카테고리 탭 스타일 구역 */
        .tab-container {
            display: flex;
            background-color: #f1f5f9;
            padding: 4px;
            border-radius: 8px;
            gap: 4px;
            margin-bottom: 12px;
        }
        .tab-button {
            flex: 1;
            padding: 9px;
            background: none;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-button.active {
            background-color: #ffffff;
            color: #4f46e5;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.06);
        }

        /* 결과 리스트 구역 (스크롤 가능) */
        #places-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }
        .place-item {
            padding: 14px;
            border: 1px solid #e2e8f0;
            background-color: white;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .place-item:hover {
            background-color: #f8fafc;
            border-color: #cbd5e1;
        }
        .place-title {
            font-size: 15px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 4px;
        }
        .place-address {
            font-size: 12px;
            color: #64748b;
            line-height: 1.4;
        }

        /* 오른쪽: 지도 영역 */
        #map {
            flex: 1;
            height: 100%;
            z-index: 1;
        }

        /* 📍 클릭 시 나타나는 커스텀 말풍선(오버레이) 디자인 */
        .custom-overlay {
            position: relative;
            bottom: 55px;
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border: 1px solid #e2e8f0;
            min-width: 220px;
            overflow: hidden;
        }
        .custom-overlay .title-bar {
            display: block;
            background: #4f46e5;
            color: white;
            padding: 9px 35px 9px 12px;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .custom-overlay .body-content {
            padding: 12px;
            font-size: 13px;
        }
        .custom-overlay .phone-number {
            margin-bottom: 8px;
            color: #475569;
        }
        .custom-overlay .map-link {
            display: block;
            text-align: center;
            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
            background: #f4f3ff;
            padding: 7px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .custom-overlay .map-link:hover {
            background: #e0e7ff;
        }
        .custom-overlay .close-button {
            position: absolute;
            top: 9px;
            right: 12px;
            color: rgba(255, 255, 255, 0.8);
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .custom-overlay .close-button:hover {
            color: white;
        }
        /* 말풍선 아래의 삼각형 꼬리 */
        .custom-overlay::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="sidebar">
            <div class="search-box">
                <input type="text" id="keyword-input" placeholder="장소를 검색해보세요!" onkeypress="if(event.keyCode==13) searchByKeyword();">
                <button id="search-button" onclick="searchByKeyword()">검색</button>
            </div>

            <div class="tab-container">
                <button id="tab-theater" class="tab-button active" onclick="switchCategory('CT1', this)">🎫 극장</button>
                <button id="tab-subway" class="tab-button" onclick="switchCategory('SW8', this)">🚇 지하철역</button>
            </div>

            <ul id="places-list"></ul>
        </div>

        <div id="map"></div>
    </div>

    <script>
        // 전역 변수 설정
        let map; // 지도 객체
        let placeService; // 장소 검색 서비스 객체
        let currentCategory = 'CT1'; // 현재 선택된 카테고리 코드 (기본값: 극장)
        let markers = []; // 지도에 표시된 일반 마커들을 관리하는 배열
        let activeOverlay = null; // 현재 지도에 열려 있는 커스텀 오버레이 객체

        // 이모지를 지도 마커 핀 이미지(SVG 형태)로 실시간 변환하는 함수
        function createEmojiMarker(emoji) {
            const svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="white" stroke="#4f46e5" stroke-width="3"/><text x="50%" y="55%" font-size="20" text-anchor="middle" dominant-baseline="middle">${emoji}</text></svg>`;
            const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
            const imageSize = new kakao.maps.Size(44, 44);
            const imageOption = { offset: new kakao.maps.Point(22, 22) };
            return new kakao.maps.MarkerImage(svgUrl, imageSize, imageOption);
        }

        // 카테고리 및 내 위치별 매핑 이모지 데이터
        const markerEmojis = {
            'CT1': '🎫',  // 극장
            'SW8': '🚇',  // 지하철역
            'USER': '👥' // 내 현재 위치 (관객 이모지)
        };

        // 초기화 함수: API가 안전하게 로드된 후 실행됨
        function initMap() {
            const container = document.getElementById('map');
            const options = {
                center: new kakao.maps.LatLng(37.582191, 127.001877), // 위치 권한 허용 전 임시 중심좌표 (대학로 혜화역 인근)
                level: 5 // 지도의 확대 레벨 설정 (요청사항: 5)
            };

            // 지도 생성
            map = new kakao.maps.Map(container, options);

            // 장소 검색 서비스 객체 생성 (기존 생성자에 map 연동 추가)
            placeService = new kakao.maps.services.Places(map);

            // 페이지 열리자마자 브라우저 기본 현재 위치 권한 요청 (Live Server 환경 필수)
            requestUserLocation();

            // 첫 진입 시 기본 카테고리(극장) 데이터 자동 수집
            searchCategoryPlaces();

            // 지도가 드래그 등으로 이동을 멈출 때마다 해당 중심점에서 주변 데이터를 재검색하는 리스너
            kakao.maps.event.addListener(map, 'idle', function() {
                searchCategoryPlaces();
            });
        }

        // 사용자의 현재 위치를 받아와 지도 중심을 이동시키는 함수
        function requestUserLocation() {
            if (navigator.geolocation) {
                // 브라우저 위치 권한 허용 팝업 실행
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude; // 위도
                    const lng = position.coords.longitude; // 경도
                    const userPosition = new kakao.maps.LatLng(lat, lng);

                    // 현재 위치를 지도의 중심으로 설정
                    map.setCenter(userPosition);

                    // 내 위치에 관객 이모지(👥) 마커 표시
                    const userMarker = new kakao.maps.Marker({
                        position: userPosition,
                        image: createEmojiMarker(markerEmojis['USER']),
                        zIndex: 5 // 내 위치 마커가 다른 장소 마커 아래로 가려지지 않게 레이어 순위 상향
                    });
                    userMarker.setMap(map);

                    // 획득한 새 중심점 기반으로 카테고리 스캔 데이터 갱신
                    searchCategoryPlaces();

                }, function(error) {
                    console.warn("위치 권한을 획득하지 못해 기본 대학로 위치를 사용합니다.", error.message);
                });
            } else {
                console.warn("이 브라우저에서는 위치 추적(Geolocation)을 지원하지 않습니다.");
            }
        }

        // 텍스트 인풋 입력을 통한 수동 키워드 검색 함수
        function searchByKeyword() {
            const keyword = document.getElementById('keyword-input').value.trim();

            if (!keyword) {
                alert('검색어를 입력해주세요!');
                return;
            }

            // 단순 검색 결과 첫 지점으로 지도 카메라 포커스 이동 처리
            placeService.keywordSearch(keyword, function(data, status) {
                if (status === kakao.maps.services.Status.OK) {
                    const firstPlace = data[0];
                    const movePosition = new kakao.maps.LatLng(firstPlace.y, firstPlace.x);
                    map.setCenter(movePosition);
                    closeOverlay();
                } else {
                    alert('검색 결과가 존재하지 않습니다.');
                }
            });
        }

        // 카테고리 탭(극장 <-> 지하철역) 스위칭 제어 함수
        function switchCategory(categoryCode, element) {
            if (currentCategory === categoryCode) return; // 동일한 탭을 반복 클릭할 경우 중단

            currentCategory = categoryCode;

            // 기존 활성화 탭 스타일 제거 및 타겟 버튼 스타일 점등
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            // 탭 변경 시 요구사항: 기존 마커 및 켜져있던 말풍선 소거
            clearMarkers();
            closeOverlay();

            // 교체된 새로운 카테고리로 장소 탐색 시작
            searchCategoryPlaces();
        }

        // 현재 지도 화면 중심 좌표점 기준으로 주변 2km 카테고리 정보를 수집하는 함수
        function searchCategoryPlaces() {
            if (!placeService || !map) return;

            placeService.categorySearch(currentCategory, function(data, status) {
                if (status === kakao.maps.services.Status.OK) {
                    clearMarkers(); // 이전 라운드 마커 폐기
                    
                    const listEl = document.getElementById('places-list');
                    listEl.innerHTML = ''; // 왼쪽 리스트 초기화

                    // 취득한 장소 배열 개수만큼 루프를 돌며 화면 구성
                    for (let i = 0; i < data.length; i++) {
                        displayPlaceItem(data[i]);
                    }
                } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                    clearMarkers();
                    document.getElementById('places-list').innerHTML = '<li style="text-align:center;color:#64748b;font-size:13px;padding:30px;">주변에 대상 장소가 없습니다.</li>';
                }
            }, {
                location: map.getCenter(),
                radius: 2000, // 탐색 반경 범위 2km 설정
                useMapCenter: true
            });
        }

        // 지도에 개별 장소 마커를 심고 목록 아이템을 바인딩 렌더링하는 함수
        function displayPlaceItem(place) {
            const markerPosition = new kakao.maps.LatLng(place.y, place.x);
            // 현재 활성화된 카테고리에 상응하는 이모지 마커 이미지 추출 할당
            const markerImage = createEmojiMarker(markerEmojis[currentCategory]);

            // 1. 오른쪽에 커스텀 이모지 마커 배치
            const marker = new kakao.maps.Marker({
                position: markerPosition,
                image: markerImage
            });
            marker.setMap(map);
            markers.push(marker); // 일괄 제거 목적 관리 배열 취합

            // 요구 조건: 클릭 시 출현할 장소명, 연락처, 카카오맵 전용 상세 정보 링크 커스텀 템플릿
            const contentString = `
                <div class="custom-overlay">
                    <span class="title-bar">${place.place_name}</span>
                    <button class="close-button" onclick="closeOverlay()">✕</button>
                    <div class="body-content">
                        <div class="phone-number">📞 ${place.phone ? place.phone : '등록된 번호 없음'}</div>
                        <a href="${place.place_url}" target="_blank" class="map-link">카카오맵 상세정보</a>
                    </div>
                </div>
            `;

            // 마커 클릭 시 예쁜 커스텀 오버레이 말풍선을 오픈하는 리스너 장착
            kakao.maps.event.addListener(marker, 'click', function() {
                if (activeOverlay) activeOverlay.setMap(null); // 기존에 다른 마커로 띄워진 오버레이 삭제

                const overlay = new kakao.maps.CustomOverlay({
                    content: contentString,
                    position: markerPosition,
                    xAnchor: 0.5,
                    yAnchor: 1.0
                });
                overlay.setMap(map);
                activeOverlay = overlay;
            });

            // 2. 왼쪽에 매칭 리스트 요소 생성 추가
            const listEl = document.getElementById('places-list');
            const itemEl = document.createElement('li');
            itemEl.className = 'place-item';
            itemEl.innerHTML = `
                <div class="place-title">${place.place_name}</div>
                <div class="place-address">${place.road_address_name ? place.road_address_name : place.address_name}</div>
            `;

            // 왼쪽 리스트 목록 클릭 시 지도를 포커스 이동하고 원격 마커 클릭 이벤트 강제 실행
            itemEl.onclick = function() {
                map.setCenter(markerPosition);
                kakao.maps.event.trigger(marker, 'click');
            };

            listEl.appendChild(itemEl);
        }

        // 현재 떠 있는 커스텀 오버레이 말풍선을 소거하는 함수
        function closeOverlay() {
            if (activeOverlay) {
                activeOverlay.setMap(null);
                activeOverlay = null;
            }
        }

        // 일반 장소 마커 배열 풀을 지도에서 감추고 초기화하는 청소 함수
        function clearMarkers() {
            for (let i = 0; i < markers.length; i++) {
                if (markers[i]) markers[i].setMap(null);
            }
            markers = [];
        }

        // 중요: 브라우저 DOM 구조가 완벽하게 정립된 후 안전하게 카카오 모듈 연동 지시
        window.addEventListener('DOMContentLoaded', function() {
            kakao.maps.load(initMap);
        });
    </script>
</body>
</html>
